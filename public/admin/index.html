<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <title>Rainy Days 写作后台</title>
  </head>
  <body>
    <main id="login-view" class="login-view">
      <form id="login-form" class="login-panel">
        <a class="brand" href="/">Rainy Days</a>
        <h1>写作后台</h1>
        <label for="password">后台密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">登录</button>
        <p id="login-status" class="status" role="status"></p>
      </form>
    </main>

    <main id="workspace" class="workspace" hidden>
      <header class="topbar">
        <a class="brand" href="/">Rainy Days</a>
        <div class="topbar-actions">
          <span id="save-status" class="status" role="status"></span>
          <button id="new-note" class="secondary" type="button">新建笔记</button>
          <button id="logout" class="quiet" type="button">退出</button>
        </div>
      </header>

      <aside class="note-browser" aria-label="笔记列表">
        <label for="category-filter">分类</label>
        <select id="category-filter">
          <option value="all">全部笔记</option>
          <option value="learning-methods">学习方法</option>
          <option value="tools">工具实践</option>
          <option value="reflections">阶段复盘</option>
        </select>
        <div id="note-list" class="note-list"></div>
      </aside>

      <form id="editor" class="editor" hidden>
        <div class="editor-heading">
          <div>
            <p id="editor-kind">新笔记</p>
            <h1 id="editor-title">未命名笔记</h1>
          </div>
          <button id="save-note" type="submit">保存并部署</button>
        </div>

        <div class="field-grid">
          <label class="wide">
            标题
            <input id="title" name="title" maxlength="80" required />
          </label>
          <label>
            分类
            <select id="category" name="category" required>
              <option value="learning-methods">学习方法</option>
              <option value="tools">工具实践</option>
              <option value="reflections">阶段复盘</option>
            </select>
          </label>
          <label>
            路径名称
            <input id="slug" name="slug" maxlength="80" required />
          </label>
          <label class="wide">
            摘要
            <textarea id="description" name="description" rows="2" required></textarea>
          </label>
          <label>
            发布日期
            <input id="published" name="published" type="date" required />
          </label>
          <label>
            更新日期
            <input id="updated" name="updated" type="date" />
          </label>
          <label class="wide">
            标签
            <input id="tags" name="tags" placeholder="学习方法, 复盘" />
          </label>
          <label class="draft-toggle wide">
            <input id="draft" name="draft" type="checkbox" checked />
            保存为草稿
          </label>
        </div>

        <div class="body-heading">
          <label for="body">正文</label>
          <button id="upload-image" class="secondary" type="button">插入图片</button>
          <input id="image-file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden />
        </div>
        <textarea id="body" name="body" class="body-editor" spellcheck="true" required></textarea>
      </form>

      <section id="empty-editor" class="empty-editor">
        <p>选择一篇笔记，或新建笔记。</p>
      </section>
    </main>

    <script type="module" src="/admin/admin.js"></script>
  </body>
</html>
