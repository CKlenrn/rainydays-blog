backend:
  name: github
  repo: CKlenrn/rainydays-blog
  branch: main
  base_url: https://rainydays.cn
  auth_endpoint: api/auth
  commit_messages:
    create: "content: create {{collection}} {{slug}}"
    update: "content: update {{collection}} {{slug}}"
    delete: "content: delete {{collection}} {{slug}}"

locale: zh_Hans
site_url: https://rainydays.cn
display_url: https://rainydays.cn
logo_url: /images/chenkun-avatar.jpg
media_folder: public/images/notes
public_folder: /images/notes
publish_mode: simple

slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: learning-methods
    label: 学习方法
    label_singular: 学习方法笔记
    folder: src/content/docs/notes/learning-methods
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} · {{published}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 摘要, name: description, widget: text }
      - { label: 发布日期, name: published, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: 更新日期, name: updated, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 草稿, name: draft, widget: boolean, default: true }
      - { label: 正文, name: body, widget: markdown }

  - name: tools
    label: 工具实践
    label_singular: 工具实践笔记
    folder: src/content/docs/notes/tools
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} · {{published}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 摘要, name: description, widget: text }
      - { label: 发布日期, name: published, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: 更新日期, name: updated, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 草稿, name: draft, widget: boolean, default: true }
      - { label: 正文, name: body, widget: markdown }

  - name: reflections
    label: 阶段复盘
    label_singular: 阶段复盘笔记
    folder: src/content/docs/notes/reflections
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} · {{published}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 摘要, name: description, widget: text }
      - { label: 发布日期, name: published, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: 更新日期, name: updated, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 草稿, name: draft, widget: boolean, default: true }
      - { label: 正文, name: body, widget: markdown }
